name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DevsLibrary Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify project files
        run: |
          echo "Checking required project files..."

          test -f package.json || {
            echo "ERROR: package.json was not found."
            exit 1
          }

          test -d android || {
            echo "ERROR: Android project directory was not found."
            exit 1
          }

          test -f android/gradlew || {
            echo "ERROR: Android Gradle wrapper was not found."
            exit 1
          }

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found; using npm install."
            npm install
          fi

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find android -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Prepare APK artifact
        run: |
          mkdir -p build-artifacts

          VERSION=$(node -p "require('./package.json').version")

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "build-artifacts/DevsLibrary-${VERSION}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevsLibrary-Android-APK
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
